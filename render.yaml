services:
  - type: web
    name: raahi
    runtime: docker
    region: frankfurt     # closest Render region to Supabase (Paris); Render cannot move a service between regions
    plan: free           # free spins down after ~15 min idle; switch to starter on demo day (docs/DEMO_DAY.md)
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TZ
        value: Asia/Kolkata
      - key: APP_BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_LLM_MODEL
        sync: false
      - key: AGENT_TOOL_SECRET
        sync: false
      - key: SESSION_SIGNING_SECRET
        generateValue: true
      - key: DEMO_ADMIN_PIN
        sync: false
